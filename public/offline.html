<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)">
  <title>Sense connexió · Offline</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/login.css">
  <script src="/js/theme.js"></script>
</head>
<body class="login-page">
  <!-- Shown by the service worker when a page is not cached and the server cannot be reached. No script: both languages. -->
  <main class="login">
    <span class="orb orb-sky login-orb-a" aria-hidden="true"></span>
    <span class="orb orb-lavender login-orb-b" aria-hidden="true"></span>

    <p class="login-mark">
      <svg class="icon icon-20" aria-hidden="true"><use href="/icons.svg#wifi-off"/></svg>
      <span>OpenFusionSolar</span>
    </p>
    <h1 class="headline">Ara mateix no hi ha connexió</h1>
    <p class="login-lead">La instal·lació continua registrant dades. Torna-ho a provar quan tinguis cobertura.</p>
    <p class="login-lead" lang="en">You are offline. The installation keeps recording; try again when you have a connection.</p>
    <p class="offline-actions"><a class="pill pill-primary" href="/">Torna-ho a provar · Try again</a></p>
  </main>
</body>
</html>
